<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>小 Claude</title>
<style>
:root { --card: rgba(18, 16, 14, .9); --card-fg: #fff; --muted: #c9bfb3; --ok: #5cc48b; --ask: #f2b705;
  --font: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--font); user-select: none; }
#wrap { position: fixed; left: 0; top: 0; }
#pet { display: block; }
#hit { position: absolute; cursor: grab; touch-action: none; }
#hit.dragging { cursor: grabbing; }
.bubble { position: absolute; left: 50%; width: max-content; max-width: 280px; padding: 10px 14px; border-radius: 14px;
  background: var(--card); color: var(--card-fg); font-size: 16px; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.35);
  border: 2px solid transparent; cursor: pointer; }
.bubble b { display: block; font-size: 17px; }
.bubble small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.bubble.done { border-color: var(--ok); }
.bubble.done b { color: var(--ok); }
.bubble.ask { border-color: var(--ask); }
.bubble.ask b { color: var(--ask); }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="pet"></canvas>
  <div id="hit" title=""></div>
  <div class="bubble" id="bubble" hidden></div>
</div>
<script>
(() => {
  'use strict';
  // 狀態檔：Claude 每次通知都會更新這個檔案（xiao-claude-pet 專案的 pet-status 分支）
  const STATUS_URL = 'https://api.github.com/repos/tomogeo/xiao-claude-pet/contents/status.json?ref=pet-status';
  const POLL_MS = 90 * 1000;   // GitHub 不登入每小時最多 60 次，90 秒一次剛好安全
  const SIZES = { s: 0.7, m: 1, l: 1.35 };
  const CW = 300, CH = 240;    // 畫布的邏輯大小（未縮放）

  const T = window.__TAURI__;
  const invoke = (c, a) => (T ? T.core.invoke(c, a) : Promise.resolve());
  const $ = (id) => document.getElementById(id);
  const ls = {
    get(k, d) { try { const v = localStorage.getItem('xc.' + k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem('xc.' + k, JSON.stringify(v)); } catch (_) {} },
  };
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  const wrap = $('wrap'), canvas = $('pet'), hitEl = $('hit'), bubble = $('bubble');
  const ctx = canvas.getContext('2d');

  let status = { state: 'idle', message: '', updatedAt: 0 };
  let ackedAt = ls.get('ackedAt', 0);
  let classMode = ls.get('classMode', true);
  let sizeKey = ls.get('size', 'm');
  let pos = ls.get('pos', null);
  let firstLoad = true;
  let lastCheck = 0, lastError = '';
  let ackFlash = -1e9, stateStart = performance.now(), sayUntil = 0, sayText = null;
  let confetti = [];
  let down = null, dragging = false;
  let audioCtx = null;

  // ---------- 狀態 ----------
  function needsAttention() {
    return (status.state === 'done' || status.state === 'ask') && status.updatedAt > ackedAt;
  }
  // 畫面上顯示的姿勢：已讀過的「做完了／提問」回到休息
  function pose() {
    if (performance.now() - ackFlash < 1800) return 'done';
    if (status.state === 'working') return 'working';
    if (needsAttention()) return status.state;
    return 'idle';
  }

  function applyStatus(next) {
    const prev = status;
    status = { state: String(next.state || 'idle'), message: String(next.message || ''), updatedAt: Number(next.updatedAt || 0) };
    if (prev.state !== status.state || prev.updatedAt !== status.updatedAt) {
      stateStart = performance.now();
      if (needsAttention()) {
        if (status.state === 'done') makeConfetti();
        if (!firstLoad) chime(status.state);
      }
    }
    renderBubble();
  }

  async function check() {
    try {
      const r = await fetch(STATUS_URL + '&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' });
      if (r.status === 404) { lastError = ''; applyStatus({ state: 'idle' }); }
      else if (!r.ok) { lastError = r.status === 403 ? 'GitHub 暫時限制讀取，稍後再試' : '讀取失敗（' + r.status + '）'; }
      else { lastError = ''; applyStatus(JSON.parse(await r.text())); }
      lastCheck = Date.now();
    } catch (e) {
      lastError = '連不上網路';
    }
    firstLoad = false;
    renderBubble();
  }

  function ack() {
    ensureAudio();
    const wasAttn = needsAttention();
    ackedAt = Math.max(ackedAt, status.updatedAt || 0);
    ls.set('ackedAt', ackedAt);
    if (wasAttn) { ackFlash = performance.now(); say('收到！', '謝謝老師，我知道您看到了', 1800); }
    else say(null, pick(['我在等 Claude 的消息', '有消息我會叫您', '今天也辛苦了！']), 1800, true);
  }

  // ---------- 聲音 ----------
  function ensureAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
  }
  function chime(kind) {
    if (classMode) return;
    ensureAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    const notes = kind === 'ask' ? [660, 880, 660] : [523, 659, 784];
    const now = audioCtx.currentTime;
    notes.forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + i * 0.16);
      g.gain.exponentialRampToValueAtTime(0.18, now + i * 0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.16 + 0.5);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + i * 0.16); o.stop(now + i * 0.16 + 0.55);
    });
  }

  // ---------- 對話泡泡 ----------
  function timeAgo(ms) {
    if (!ms) return '';
    const m = Math.floor((Date.now() - ms) / 60000);
    if (m < 1) return '剛剛';
    if (m < 60) return m + ' 分鐘前';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' 小時前';
    return Math.floor(h / 24) + ' 天前';
  }
  function say(title, body, ms, plain) {
    sayText = { title, body, plain };
    sayUntil = performance.now() + ms;
    renderBubble();
  }
  function renderBubble() {
    let title = null, body = '', small = '', cls = '';
    if (performance.now() < sayUntil && sayText) {
      ({ title, body } = sayText);
      cls = sayText.plain ? '' : 'done';
    } else if (needsAttention()) {
      cls = status.state;
      title = status.state === 'done' ? '做完了！' : '老師，有問題想問您';
      body = status.message || (status.state === 'done' ? '回 Claude App 看結果吧' : '請回 Claude App 回答我');
      small = timeAgo(status.updatedAt) + '・點我表示已讀';
    } else if (status.state === 'working') {
      title = '工作中…';
      body = status.message;
    } else {
      bubble.hidden = true;
      return;
    }
    bubble.className = 'bubble ' + cls;
    bubble.replaceChildren();
    if (title) { const b = document.createElement('b'); b.textContent = title; bubble.append(b); }
    if (body) bubble.append(document.createTextNode(body));
    if (small) { const s = document.createElement('small'); s.textContent = small; bubble.append(s); }
    bubble.hidden = false;
    placeBubble();
  }
  function placeBubble() {
    if (bubble.hidden) return;
    const k = SIZES[sizeKey] || 1;
    const anchor = 52 * k;             // 帽子上緣
    const top = parseFloat(wrap.style.top) || 0;
    if (top + anchor - bubble.offsetHeight - 6 < 0) {
      bubble.style.top = (CH * k - 4) + 'px';      // 太靠上：泡泡放到腳下
      bubble.style.transform = 'translate(-50%, 0)';
    } else {
      bubble.style.top = anchor + 'px';
      bubble.style.transform = 'translate(-50%, -100%)';
    }
  }

  // ---------- 大小與位置 ----------
  function applySize() {
    const k = SIZES[sizeKey] || 1, dpr = window.devicePixelRatio || 1;
    canvas.style.width = CW * k + 'px'; canvas.style.height = CH * k + 'px';
    canvas.width = Math.round(CW * k * dpr); canvas.height = Math.round(CH * k * dpr);
    wrap.style.width = CW * k + 'px';
    // 可以點、可以拖的範圍：小 Claude 身體附近
    Object.assign(hitEl.style, { left: 80 * k + 'px', top: 55 * k + 'px', width: 140 * k + 'px', height: 180 * k + 'px' });
    placeAt(pos ? pos.x : null, pos ? pos.y : null);
  }
  function placeAt(x, y) {
    const k = SIZES[sizeKey] || 1;
    const maxX = window.innerWidth - CW * k, maxY = window.innerHeight - CH * k;
    if (x == null) { x = maxX - 20; y = maxY; }      // 第一次：右下角
    x = Math.max(-60 * k, Math.min(maxX + 60 * k, x));
    y = Math.max(-40 * k, Math.min(maxY + 4, y));
    wrap.style.left = x + 'px'; wrap.style.top = y + 'px';
    pos = { x, y };
    placeBubble();
  }
  window.addEventListener('resize', () => applySize());

  // ---------- 點擊、拖曳、右鍵 ----------
  let lastSent = '';
  function sendHit() {
    const rects = [];
    for (const el of [hitEl, bubble]) {
      if (el.hidden) continue;
      const r = el.getBoundingClientRect();
      rects.push([Math.round(r.left) - 4, Math.round(r.top) - 4, Math.round(r.width) + 8, Math.round(r.height) + 8]);
    }
    const key = JSON.stringify([rects, dragging || !!down]);
    if (key !== lastSent) { lastSent = key; invoke('set_hit', { rects, capture: dragging || !!down }); }
  }
  setInterval(sendHit, 40);

  hitEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); hitEl.setPointerCapture(e.pointerId);
    down = { x: e.clientX, y: e.clientY, ox: e.clientX - pos.x, oy: e.clientY - pos.y, moved: false };
    sendHit();
  });
  hitEl.addEventListener('pointermove', (e) => {
    if (!down) return;
    if (!down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down.moved = true; dragging = true; hitEl.classList.add('dragging'); }
    if (dragging) placeAt(e.clientX - down.ox, e.clientY - down.oy);
  });
  function release() {
    if (!down) return;
    const moved = down.moved; down = null; dragging = false; hitEl.classList.remove('dragging');
    if (moved) ls.set('pos', pos); else ack();
    sendHit();
  }
  hitEl.addEventListener('pointerup', release);
  hitEl.addEventListener('pointercancel', release);
  bubble.addEventListener('click', ack);
  hitEl.addEventListener('pointerenter', () => {
    if (!bubble.hidden) return;
    const info = lastError || (lastCheck ? '上次檢查：' + timeAgo(lastCheck) : '正在檢查…');
    say('休息中', info, 2200, true);
  });
  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (e.target === hitEl || bubble.contains(e.target)) invoke('show_menu', { classMode, size: sizeKey });
  });

  if (T) T.event.listen('command', (e) => {
    const c = e.payload;
    if (c === 'class:toggle') {
      classMode = !classMode; ls.set('classMode', classMode);
      say(null, classMode ? '上課模式：只閃光，不出聲' : '下課模式：有消息會叮咚', 1800, true);
      if (!classMode) chime('done');
    } else if (c === 'check') { check(); say(null, '檢查中…', 1200, true); }
    else if (typeof c === 'string' && c.startsWith('size:')) { sizeKey = c.slice(5); ls.set('size', sizeKey); applySize(); }
  });

  // ---------- 畫小 Claude ----------
  const ORANGE = '#ec8a46', ORANGE_DK = '#c96a2a', HAT = '#d9c08a', HAT_DK = '#b39860', EYE = '#2b211b';
  const OKC = '#5cc48b', ASKC = '#f2b705';
  // 原本網頁版的座標：中心 x=240、腳底 y=262；這裡平移到 300×240 的畫布
  const OX = -90, OY = -37, W0 = 480;

  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function makeConfetti() {
    const cols = ['#ec8a46', '#3fa7d6', '#59c36a', '#f2c14e', '#e86a92'];
    confetti = Array.from({ length: 30 }, () => ({
      x: W0 / 2 + (Math.random() - 0.5) * 100, y: 170,
      vx: (Math.random() - 0.5) * 5, vy: -3 - Math.random() * 4,
      r: Math.random() * Math.PI, c: cols[(Math.random() * cols.length) | 0],
    }));
  }
  function drawGlobe(x, y, r, spin) {
    ctx.fillStyle = HAT_DK; rr(x - 3, y + r, 6, 14, 2); ctx.fill();
    rr(x - 16, y + r + 12, 32, 6, 3); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#3fa7d6'; ctx.fill();
    ctx.clip();
    ctx.fillStyle = '#59c36a';
    const off = (spin * 18) % (r * 4);
    for (let k = -1; k < 2; k++) {
      const bx = x - r + off + k * r * 2;
      ctx.beginPath(); ctx.ellipse(bx, y - r * 0.3, r * 0.45, r * 0.3, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(bx + r * 0.7, y + r * 0.35, r * 0.3, r * 0.4, -0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = HAT_DK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r + 3, -2.4, 0.8); ctx.stroke();
  }

  function drawPet(t) {
    const s = pose();
    const since = (performance.now() - stateStart) / 1000;
    const cx = W0 / 2, baseY = 262;
    let bob = Math.sin(t * 2) * 3, squash = 1 + Math.sin(t * 2) * 0.02;
    if (s === 'done') { const j = Math.abs(Math.sin(t * 5)); bob = -j * 22; squash = 1 + (1 - j) * 0.06; }
    if (s === 'ask') bob = Math.sin(t * 4) * 4;
    if (s === 'working') bob = Math.sin(t * 9) * 1.5;
    const hop = (performance.now() - ackFlash) / 600;
    if (hop >= 0 && hop < 1) bob = -Math.sin(hop * Math.PI) * 28;
    const cy = baseY - 62 + bob;

    // 需要注意時：身後一圈會呼吸的光
    if (needsAttention()) {
      const pulse = (Math.sin(t * 5) + 1) / 2;
      const col = status.state === 'done' ? OKC : ASKC;
      const g = ctx.createRadialGradient(cx, cy, 50, cx, cy, 105);
      g.addColorStop(0, col + '00'); g.addColorStop(0.55, col + Math.round(80 + pulse * 140).toString(16).padStart(2, '0')); g.addColorStop(1, col + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 105, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(cx, baseY + 4, 58 - Math.abs(bob) * 0.8, 9, 0, 0, Math.PI * 2); ctx.fill();

    if (s === 'idle') drawGlobe(cx + 106, baseY - 50, 22, t);

    ctx.fillStyle = ORANGE_DK;
    ctx.beginPath(); ctx.ellipse(cx - 24, baseY - 4 + Math.min(0, bob) * 0.6, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 24, baseY - 4 + Math.min(0, bob) * 0.6, 16, 9, 0, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = ORANGE_DK; ctx.lineWidth = 11; ctx.lineCap = 'round';
    const arm = (sx, sy, ex, ey) => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.fillStyle = ORANGE; ctx.beginPath(); ctx.arc(ex, ey, 8, 0, Math.PI * 2); ctx.fill(); };
    if (s === 'done') {
      const w = Math.sin(t * 10) * 6;
      arm(cx - 52, cy + 4, cx - 80, cy - 46 + w); arm(cx + 52, cy + 4, cx + 80, cy - 46 - w);
    } else if (s === 'ask') {
      const w = Math.sin(t * 6) * 8;
      arm(cx + 52, cy, cx + 74 + w, cy - 62); arm(cx - 52, cy + 10, cx - 66, cy + 34);
    } else if (s === 'working') {
      const a = Math.sin(t * 18) * 4, b = Math.cos(t * 18) * 4;
      arm(cx - 50, cy + 14, cx - 26, cy + 56 + a); arm(cx + 50, cy + 14, cx + 26, cy + 56 + b);
    } else {
      arm(cx - 52, cy + 10, cx - 66, cy + 36); arm(cx + 52, cy + 10, cx + 66, cy + 36);
    }

    ctx.save(); ctx.translate(cx, cy); ctx.scale(1 / squash, squash);
    const g = ctx.createRadialGradient(-18, -22, 10, 0, 0, 66);
    g.addColorStop(0, '#f7a668'); g.addColorStop(1, ORANGE);
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, 60, 56, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    const blink = s !== 'done' && (t % 4.2) > 4.05;
    const sleepy = s === 'idle' && since > 20 && (t % 9) > 6;
    const ey = cy - 4, ex = 21;
    if (s === 'done') {
      ctx.strokeStyle = EYE; ctx.lineWidth = 4;
      [-ex, ex].forEach((d) => { ctx.beginPath(); ctx.arc(cx + d, ey + 4, 8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); });
    } else if (blink || sleepy) {
      ctx.strokeStyle = EYE; ctx.lineWidth = 4;
      [-ex, ex].forEach((d) => { ctx.beginPath(); ctx.moveTo(cx + d - 7, ey); ctx.lineTo(cx + d + 7, ey); ctx.stroke(); });
    } else {
      const look = s === 'working' ? 3 : 0;
      [-ex, ex].forEach((d) => {
        ctx.fillStyle = EYE; ctx.beginPath(); ctx.ellipse(cx + d, ey + look, 7, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + d - 2, ey - 3 + look, 2.6, 0, Math.PI * 2); ctx.fill();
      });
    }
    ctx.fillStyle = 'rgba(240,110,120,0.45)';
    ctx.beginPath(); ctx.ellipse(cx - 36, cy + 12, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 36, cy + 12, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = EYE; ctx.lineWidth = 3;
    ctx.beginPath();
    if (s === 'done') { ctx.fillStyle = '#7a2e20'; ctx.arc(cx, cy + 14, 9, 0, Math.PI); ctx.fill(); }
    else if (s === 'ask') { ctx.ellipse(cx, cy + 18, 5, 6, 0, 0, Math.PI * 2); ctx.stroke(); }
    else { ctx.arc(cx, cy + 12, 7, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }

    const hy = cy - 50;
    ctx.fillStyle = HAT_DK; ctx.beginPath(); ctx.ellipse(cx, hy + 6, 56, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = HAT; ctx.beginPath(); ctx.ellipse(cx, hy, 36, 26, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#7a5a32'; ctx.fillRect(cx - 36, hy - 4, 72, 7);
    ctx.fillStyle = HAT_DK; ctx.beginPath(); ctx.arc(cx, hy - 26, 4, 0, Math.PI * 2); ctx.fill();

    if (s === 'working') {
      ctx.fillStyle = '#6f7782'; rr(cx - 46, baseY - 16, 92, 8, 3); ctx.fill();
      ctx.fillStyle = '#8d96a3'; rr(cx - 40, baseY - 58, 80, 44, 5); ctx.fill();
      ctx.fillStyle = '#cfe6f7'; rr(cx - 34, baseY - 53, 68, 32, 3); ctx.fill();
      ctx.fillStyle = '#3fa7d6';
      for (let i = 0; i < 3; i++) { const w = 20 + ((Math.sin(t * 3 + i) + 1) * 18); ctx.fillRect(cx - 28, baseY - 48 + i * 9, w, 4); }
      ctx.fillStyle = ORANGE;
      ctx.beginPath(); ctx.arc(cx - 26, baseY - 18 + Math.sin(t * 18) * 3, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 26, baseY - 18 + Math.cos(t * 18) * 3, 8, 0, Math.PI * 2); ctx.fill();
    }

    if (sleepy) {
      ctx.fillStyle = '#8a7f73'; ctx.font = '700 20px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText('z', cx + 58, cy - 46 - ((t * 10) % 12)); ctx.fillText('Z', cx + 72, cy - 66 - ((t * 10) % 12));
    }
    if (s === 'ask') {
      ctx.fillStyle = ASKC; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.font = '700 44px Arial, sans-serif';
      const qy = cy - 34 + Math.sin(t * 4) * 5;
      ctx.strokeText('?', cx - 98, qy); ctx.fillText('?', cx - 98, qy);
    }
  }

  const t0 = performance.now();
  let lastFrame = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (now - lastFrame < 33) return;      // 約 30 格／秒就夠，省電
    lastFrame = now;
    const k = SIZES[sizeKey] || 1, dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    ctx.translate(OX, OY);
    if (confetti.length) {
      confetti.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.r += 0.2;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-4, -2, 8, 4); ctx.restore(); });
      confetti = confetti.filter((p) => p.y < 300);
    }
    drawPet((now - t0) / 1000);
    if (sayText && now >= sayUntil) { sayText = null; renderBubble(); }
  }

  // 第一次執行：開機自動啟動（右鍵選單可以關）
  if (!ls.get('autoInit', false)) { invoke('set_autostart', { on: true }); ls.set('autoInit', true); }

  applySize();
  requestAnimationFrame(frame);
  check();
  setInterval(check, POLL_MS);
  setInterval(renderBubble, 60 * 1000);   // 更新「幾分鐘前」
})();
</script>
</body>
</html>
